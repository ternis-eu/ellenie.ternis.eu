    body {
      font-family: Georgia, 'Times New Roman', serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #fdfdfd;
      color: #111;
      line-height: 1.6;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 40px;
      text-align: center;
      color: #111;
      text-transform: uppercase;
    }
    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    li {
      margin: 0;
    }
    a {
      display: flex;
      align-items: center;
      gap: 15px;
      color: #111;
      text-decoration: none;
      padding: 20px;
      background: #fff;
      border: 2px solid #111;
      border-radius: 8px;
      box-shadow: 5px 5px 0px #111;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
      font-weight: 600;
    }
    a:hover {
      background-color: #f0f0f0;
      box-shadow: 8px 8px 0px #0066cc;
      color: #0066cc;
    }
    a:hover svg {
      color: #0066cc;
    }
    svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: #111;
      transition: color 0.2s ease;
    }
    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 2px dashed #ccc;
      text-align: center;
    }
    .footer-link {
      display: inline-flex;
      justify-content: center;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 10px;
      font-size: 0.9em;
      color: #555;
      font-weight: 500;
    }
    .footer-link:hover {
      background-color: transparent;
      box-shadow: none;
      color: #0066cc;
    }
    .footer-link svg {
      color: #555;
    }
  </style>
</head>
